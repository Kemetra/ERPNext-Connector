# Agent OS execution map — spec 003 Data-Pulse Auth & API Policy
# Conforms to docs/agent-os/slice-schema.yaml. Maestro reads this as the
# source of truth for slice state. Slices reference specs/003-.../tasks.md task IDs.
#
# This spec is docs/policy only (FR-011): all slices use the docs-mapping agent,
# none touch gated surfaces (standing-rules §3), so approval_required is false.
# Staging authentication (SC-001) is deferred — needs a staging env AND a DP2
# connector token scope (see the TOKEN_SCOPE_DEPENDENCY slice / decision record).

spec: 003-data-pulse-auth-and-api-policy
version: 1
base: origin/main

findings: []

slices:

  - id: POLICY_SKELETON
    task_ids: ["T001", "T002"]
    type: docs
    status: ready
    approval_required: false
    depends_on: []
    blocks: ["AUTH_DIRECTION_AND_MODEL", "IDEMPOTENCY_AND_TAXONOMY", "SECRETS_AND_CORRELATION"]
    agent: docs-mapping
    allowed_files:
      - docs/decisions/data-pulse-auth-and-api-policy.md
    validation:
      - command: review against spec FR-012 + research.md Decision 1
        expected: skeleton + "Sources & precedence" present; direction = connector->DP2
        bench_required: false
    stop:
