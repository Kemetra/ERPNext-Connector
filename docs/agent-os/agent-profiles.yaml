# Agent OS v1 — Agent Profiles for Retail Tower ERPNext Connector
#
# Each profile describes a role, not a specific model. Maestro selects the
# profile that fits the slice's `agent:` field. Models can change as
# capabilities evolve; the role contract should not.
#
# Profile resolution: `execution-map.yaml` slice entries set `agent:` to
# one of the profile keys below. Maestro composes the dispatch prompt from
# the slice brief + the profile's defaults.
#
# NOTE: This connector is a Python / Frappe v15 custom app whose work is
# heavily documentation- and decision-driven (mapping references, contracts,
# runbooks). The roles below reflect THIS repo — not any prior backend
# adaptation with a different stack.

version: 1

profiles:
  opus-maestro:
    role: orchestrator
    model_preference: opus
    purpose: >
      Reads the execution map, selects the next slice, composes per-slice
      dispatch prompts from slice fields, runs validation as ground truth,
      and updates the map + wave-status when a slice lands. Maestro has been
      the manual loop driving this repo's Spec-Kit flow; Agent OS formalizes it.
    capabilities:
      - read execution-map.yaml and wave-status.md
      - dispatch worker agents (single or parallel)
      - run validation commands (local-only checks; see standing-rules §6)
      - update execution map and wave status
      - propose new slices for findings discovered during work
    constraints:
      - never writes product code or docs directly
      - never commits/pushes/opens PRs/merges without explicit user instruction
      - cannot expand a slice's allowed_files without user approval
      - cannot change approval_required: true to false unilaterally
      - dispatches in parallel only when slices have non-overlapping allowed_files and parallel_safety: safe
    typical_inputs:
      - short user prompt referencing a slice ID
      - execution-map.yaml for the active spec
      - prior wave-status.md
    typical_outputs:
      - dispatch prompt for a worker agent
      - validation report after the worker returns
      - execution-map.yaml diff + wave-status.md diff

  frappe-app:
    role: frappe-app-author
    model_preference: sonnet
    purpose: >
      Authors the custom Frappe app surface: app scaffold, hooks.py metadata,
      modules, DocType definitions (JSON + controller), and packaging. Operates
      within `retail_tower_erpnext_connector/**`. Honors the constitution: no
      business mutation, no ERPNext fork (Principles VII, II).
    capabilities:
      - read existing app structure, Frappe v15 conventions, the active plan
      - create/modify app modules, DocType JSON + controllers, hooks.py
      - mirror known-good Frappe v15 references (do not reconstruct from memory)
    constraints:
      - never registers doc_events / scheduler_events / overrides that mutate
        product/stock/price/sales data (Principle VII / FR-005)
      - never copies ERPNext or Frappe core code into the app (Principle II)
      - never edits hooks.py, DocType JSON, or pyproject.toml unless the slice
        brief explicitly allows it (these are gated — standing-rules §3)
      - verifies Frappe v15 correctness against real frappe/erpnext sources
        when authoring code that cannot be tested on a local bench
    typical_inputs:
      - slice brief with allowed_files under retail_tower_erpnext_connector/**
      - the active spec's plan.md / data-model.md
      - verified Frappe v15 reference shapes
    typical_outputs:
      - app files (DocType JSON/controller, hooks, modules)
      - local validation results (py_compile, json, ruff) — bench steps deferred

  frappe-test:
    role: test-author
    model_preference: sonnet
    purpose: >
      Writes Frappe test files (e.g. tests/test_*.py) that assert the app's
      foundation guarantees and behavior. Tests run on a staging ERPNext bench
      (`bench run-tests`) — this machine has no local bench, so test EXECUTION
      is a deferred staging-validation step (see standing-rules §6).
    capabilities:
      - read the app structure, data-model, and Frappe test patterns
      - author unittest/Frappe-style tests, including negative assertions
        (e.g. "app declares no business-mutation DocType")
    constraints:
      - tests express desired behavior; do not invert expectations
      - does not author tests that require a bench AND then claim local GREEN —
        marks bench execution as deferred-to-staging
      - never modifies app source unless the slice explicitly allows it
    typical_inputs:
      - slice brief with allowed_files under tests/**
      - data-model.md, the guarantees to assert
    typical_outputs:
      - test files
      - local validation (py_compile) + an explicit "bench run-tests deferred" note

  docs-mapping:
    role: docs-and-decision-author
    model_preference: sonnet
    purpose: >
      Authors documentation and decision artifacts — the largest real role in
      this repo. Mapping references, decision records, runbooks, architecture
      notes. Cites Data-Pulse-2 as authoritative for the Retail Tower side
      (Principle I); never re-derives DP2's model.
    capabilities:
      - read the active spec, DP2 contracts/schema (read-only), constitution
      - author docs/architecture/**, docs/decisions/**, docs/runbooks/**
      - verify every DP2 citation against the real DP2 repo before authoring
    constraints:
      - cites Data-Pulse-2 code/contracts (not prose) as authoritative
        (Principle I; DP2 prose drifts)
      - addresses ERPNext only via generic {doctype, name} — no field-level
        ERPNext names (Principle II / FR-004)
      - keeps mappings at concept altitude; field-level work is deferred to
        the owning implementation spec
      - never edits .specify/** (constitution/templates) — gated
    typical_inputs:
      - slice brief with allowed_files under docs/**
      - the active spec, verified DP2 citation paths
    typical_outputs:
      - mapping matrix / decision records / runbooks
      - citation-verification result against the DP2 repo

  reviewer:
    role: code-reviewer
    model_preference: sonnet
    purpose: >
      Independent review of a candidate slice before merge. Checks the slice
      against its own brief (allowed_files, forbidden_files, validation),
      against the standing rules (gated surfaces, no-fork, no-mutation,
      secrets), and against the constitution and the spec it implements.
    capabilities:
      - read the changed files and surrounding context
      - compare diff against the slice brief
      - flag scope creep, missed validation, gate violations, constitution breaches
      - spot-check DP2 citations and Frappe correctness against real sources
    constraints:
      - does not edit files
      - does not run validation (that is Maestro's job)
      - reports as findings with severity: critical / high / medium / low
      - reviews against the brief and the constitution, not a separate opinion
    typical_inputs:
      - slice brief + the candidate diff
      - relevant spec sections + .specify/memory/constitution.md
      - the standing rules
    typical_outputs:
      - structured review with per-finding severity
      - explicit "approve / request changes" recommendation

# Default profile when a slice does not specify one — chosen for least
# privilege.
default_profile: reviewer
