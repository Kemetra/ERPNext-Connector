<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Two designs compared. AI-integrated: the AI sits outside the system boundary and reaches it through a side channel. AI-embedded: the AI runs through every layer inside the boundary, under the same rules.">
<title>Two designs compared. AI-integrated: the AI sits outside the system boundary and reaches it through a side channel. AI-embedded: the AI runs through every layer inside the boundary, under the same rules.</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b1f"/><stop offset=".55" stop-color="#0c1230"/><stop offset="1" stop-color="#060918"/>
  </linearGradient>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <linearGradient id="auroraV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1L9 5L1 9z" fill="#cbd5e1"/>
  </marker>
  <linearGradient id="g-pos" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
  <linearGradient id="g-console" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
  <linearGradient id="g-core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
  <linearGradient id="g-connector" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient>
</defs>

<style>
  text{font-family:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  .flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
  .spark{stroke-dasharray:46 460;animation:spark 3.2s linear infinite}
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  .beacon{animation:beacon 2s ease-in-out infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  @keyframes spark{from{stroke-dashoffset:0}to{stroke-dashoffset:-506}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes beacon{0%,100%{opacity:.25;r:5}50%{opacity:1;r:8}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1280" height="460" rx="20" fill="url(#bg)"/>
<rect width="1280" height="460" rx="20" fill="url(#grid)"/>
<circle cx="940" cy="230" r="230" fill="#7c3aed" opacity="0.22" filter="url(#soft)"/>
<circle cx="300" cy="230" r="160" fill="#475569" opacity="0.12" filter="url(#soft)"/>
<rect x=".5" y=".5" width="1279" height="459" rx="20" fill="none" stroke="#334155" stroke-opacity=".7"/>
