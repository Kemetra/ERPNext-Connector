<text x="970.0" y="306.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">AI</text>
<text x="890" y="410" text-anchor="middle" font-size="13" fill="#e2e8f0">inside the boundary · same rules, same audit · shapes the design</text>
</svg>
